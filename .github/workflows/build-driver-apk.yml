name: Build & release driver APK

# Триггер: push тега вида v1.5.4 или v1.5.4-beta.1.
# Обычные коммиты — не собираем APK, только релизные теги.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

  # Ручной запуск через UI (Actions → Run workflow) — на случай пересборки
  # уже опубликованной версии; тег указывается вручную в input.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для сборки (например v1.5.4). Должен уже существовать.'
        required: true
        type: string

permissions:
  contents: write   # создание Release + загрузка APK-asset'а

concurrency:
  group: build-driver-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. checkout ─────────────────────────────────────────────────────────
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      # ── 2. Определяем channel и версию из имени тега ────────────────────────
      - name: Parse tag → version + channel
        id: parse
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # v1.5.4  → version=1.5.4, channel=production
          # v1.5.4-beta.1 → version=1.5.4-beta.1, channel=beta
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-beta.* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="production"
          fi
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"  >> "$GITHUB_OUTPUT"
          echo "🏷  tag=$TAG · version=$VERSION · channel=$CHANNEL"

      # ── 3. Node.js + npm cache ──────────────────────────────────────────────
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # ── 4. JDK 17 (нужен gradle Android plugin) ─────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 5. gradle cache ─────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 6. Расшифровываем keystore из Secrets ───────────────────────────────
      # RELEASE_KEYSTORE_BASE64 — base64 файла keystore (получен через
      #   `base64 -w0 taxi-sphere-driver.keystore` на dev-машине).
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret не задан. Настройте secrets в Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/taxi-sphere-driver.keystore
          ls -la keystore/taxi-sphere-driver.keystore

      # ── 7. keystore.properties из Secrets ───────────────────────────────────
      - name: Write keystore.properties
        env:
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # rootProject.projectDir = $repo/android/, поэтому путь идёт от android/
          # вверх на 1 уровень → в корень репо → в keystore/. На CI (Linux) вложенности
          # meta-папок нет, ../../ увёл бы в /home/runner/work/{repo}/, где keystore нет.
          cat > keystore.properties <<EOF
          TAXI_SPHERE_UPLOAD_STORE_FILE=../keystore/taxi-sphere-driver.keystore
          TAXI_SPHERE_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          TAXI_SPHERE_UPLOAD_STORE_PASSWORD=${KEY_PASSWORD}
          TAXI_SPHERE_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      # ── 8. Prebuild — плагин применит signing config в android/app/build.gradle ──
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      # ── 9. Собираем APK ─────────────────────────────────────────────────────
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          # Nothing special; ubuntu-latest = ASCII path, всё работает штатно.
          NODE_ENV: production

      - name: Verify APK exists
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK не создан: $APK" >&2
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "size=$SIZE"     >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "✅ APK ready · $((SIZE / 1024 / 1024)) МБ · sha256=$SHA256"
        id: apk

      # ── 10. GitHub Release + APK как asset ──────────────────────────────────
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: ${{ steps.parse.outputs.tag }}
          prerelease: ${{ steps.parse.outputs.channel == 'beta' }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk

      # ── 11. Регистрируем релиз в БД Taxi Sphere (non-blocking) ──────────────
      # Backend >= v1.99.25 поддерживает X-Service-Token bypass RBAC.
      # На старых версиях вернётся 403 — это не блокирует workflow: сборка и
      # GitHub Release уже готовы, админ сможет вставить URL в /admin/driver-app/releases
      # вручную. Продолжаем всегда через `continue-on-error`.
      - name: Register release in Taxi Sphere admin (non-blocking)
        continue-on-error: true
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.parse.outputs.tag }}/app-release.apk"
          if [ -z "$ADMIN_API_URL" ] || [ -z "$ADMIN_API_TOKEN" ]; then
            echo "::warning::ADMIN_API_URL / ADMIN_API_TOKEN не заданы — пропускаю регистрацию в БД."
            echo "Ручная регистрация: /admin/driver-app/releases → «Опубликовать релиз» → URL:"
            echo "  $APK_URL"
            exit 0
          fi
          PAYLOAD=$(cat <<EOF
          {
            "version":       "${{ steps.parse.outputs.version }}",
            "channel":       "${{ steps.parse.outputs.channel }}",
            "apkUrl":        "$APK_URL",
            "apkSizeBytes":  ${{ steps.apk.outputs.size }},
            "apkSha256":     "${{ steps.apk.outputs.sha256 }}",
            "changelog":     null,
            "minRequiredVersion": null,
            "isForced":      false
          }
          EOF
          )
          HTTP=$(curl -sS -w '\n%{http_code}' -X POST \
            "$ADMIN_API_URL/api/admin/driver-app/releases" \
            -H "Content-Type: application/json" \
            -H "X-Service-Token: $ADMIN_API_TOKEN" \
            -d "$PAYLOAD" || echo -e "\n000")
          BODY=$(echo "$HTTP" | head -n -1)
          CODE=$(echo "$HTTP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::warning::Регистрация в БД не прошла (HTTP $CODE). Возможно прод ещё не обновлён до v1.99.25 (нет service-token поддержки). Вставьте URL вручную в /admin/driver-app/releases:"
            echo "  $APK_URL"
            exit 0
          fi
          echo "✅ Релиз ${{ steps.parse.outputs.version }} зарегистрирован в канале «${{ steps.parse.outputs.channel }}»"

      - name: Summary
        run: |
          {
            echo "## 📦 Релиз ${{ steps.parse.outputs.tag }}"
            echo ""
            echo "| Поле | Значение |"
            echo "|---|---|"
            echo "| Версия | ${{ steps.parse.outputs.version }} |"
            echo "| Канал | ${{ steps.parse.outputs.channel }} |"
            echo "| Размер | $((${{ steps.apk.outputs.size }} / 1024 / 1024)) МБ |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| APK | [download](https://github.com/${{ github.repository }}/releases/download/${{ steps.parse.outputs.tag }}/app-release.apk) |"
          } >> "$GITHUB_STEP_SUMMARY"
