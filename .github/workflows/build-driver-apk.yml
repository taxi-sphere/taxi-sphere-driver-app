name: Build & release driver APK

# Триггер: push тега вида v1.5.4 или v1.5.4-beta.1.
# Сборка только СОБИРАЕТ APK и кладёт его в GitHub Release. Кому он
# достанется — решает админка (Приложение водителя → Релизы).
# Версия в app.json и package.json обязана совпадать с тегом ПОЛНОСТЬЮ,
# включая суффикс беты — иначе обновление не покажется (см. шаг 2a).
# Обычные коммиты — не собираем APK, только релизные теги.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

  # Ручной запуск через UI (Actions → Run workflow) — на случай пересборки
  # уже опубликованной версии; тег указывается вручную в input.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для сборки (например v1.5.4). Должен уже существовать.'
        required: true
        type: string

permissions:
  contents: write   # создание Release + загрузка APK-asset'а

concurrency:
  group: build-driver-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    # Первая (холодная) сборка занимает ~29 мин на assembleRelease под Fabric+KSP,
    # после чего remaining шаги (Release, register в БД) не должны упереться в лимит.
    # Даём запас на случай флаки сети GitHub Release API.
    timeout-minutes: 60

    # Ключ Google Maps. Читается в app.config.js, а app config вычисляется в
    # сборке дважды: `expo prebuild` кладёт ключ в AndroidManifest как
    # com.google.android.geo.API_KEY, а gradle-задача бандла JS — в
    # Constants.expoConfig, откуда его читает isEmbeddedMapAvailable().
    # Поэтому переменная задаётся на уровне job, а не одного шага.
    #
    # Secret заводится в Settings → Secrets and variables → Actions.
    # Если он не задан, сборка НЕ падает: APK соберётся без встроенной карты,
    # приложение останется рабочим (маршрут строится во внешнем навигаторе).
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      # ── 1. checkout ─────────────────────────────────────────────────────────
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      # ── 2. Определяем channel и версию из имени тега ────────────────────────
      - name: Parse tag → version + channel
        id: parse
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # v1.5.4  → version=1.5.4, channel=production
          # v1.5.4-beta.1 → version=1.5.4-beta.1, channel=beta
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-beta.* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="production"
          fi
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"  >> "$GITHUB_OUTPUT"
          echo "🏷  tag=$TAG · version=$VERSION · channel=$CHANNEL"

      # ── 2a. Версия в тегe и в манифестах обязана совпадать ──────────────────
      # ЗАЧЕМ. Приложение сравнивает версию из ответа сервера со СВОЕЙ
      # (`Constants.expoConfig.version`). Если собрать тег `v1.5.18-beta.1`
      # из коммита, где в app.json стоит `1.5.18`, установленная бета
      # отрапортует «1.5.18» — то есть окажется СТАРШЕ предлагаемой
      # `1.5.18-beta.1`, и обновление не покажут никогда. Ошибка тихая:
      # сборка зелёная, APK на месте, а водители обновление не видят.
      # Дешевле уронить сборку здесь.
      - name: Тег и версия в app.json должны совпадать
        run: |
          APP_VERSION=$(jq -r '.expo.version' app.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG_VERSION="${{ steps.parse.outputs.version }}"

          echo "тег:          $TAG_VERSION"
          echo "app.json:     $APP_VERSION"
          echo "package.json: $PKG_VERSION"

          FAILED=0
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::app.json version ($APP_VERSION) не совпадает с тегом ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) не совпадает с тегом ($TAG_VERSION)"
            FAILED=1
          fi
          if [ "$FAILED" = "1" ]; then
            echo "Поправьте версию в манифестах, передвиньте тег и запустите сборку заново."
            exit 1
          fi
          echo "✅ версии совпадают"

      # ── 3. Node.js + npm cache ──────────────────────────────────────────────
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # ── 3.1. Совместимость Expo-модулей с SDK ───────────────────────────────
      # Ловит пакеты, поставленные обычным `npm install` вместо
      # `npx expo install`: у них peerDependencies указаны как `expo: "*"`,
      # поэтому npm молчит, typecheck и lint проходят, APK собирается — а на
      # устройстве приложение падает при запуске. Так v1.5.6/v1.5.7 ушли в
      # прод с expo-keep-awake@57 при SDK 55 и крешились с
      # NoClassDefFoundError на expo.modules.kotlin.types.AnyTypeCache.
      #
      # Скрипт валит сборку ТОЛЬКО на расхождении мажора (для 0.x — минора).
      # Голый `expo install --check` возвращает exit 1 на любом отставании,
      # включая патчи (их обычно ~20) — такой шаг был бы вечно красным.
      - name: Check Expo module compatibility
        run: node scripts/check-expo-deps.mjs

      # ── 3.2. Типы ───────────────────────────────────────────────────────────
      # До v1.5.9 typecheck в CI не запускался вовсе, и ошибки копились
      # незамеченными: 7 штук, включая `orderId does not exist in type
      # Partial<LogEntry>` — из-за неё логи водителя доходили до админки без
      # привязки к заказу, и разбирать инциденты было нечем.
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # ── 3.3. Unit-тесты чистых функций ──────────────────────────────────────
      # Покрыты нормализация телефона, разбор адресов и шаг времени подачи.
      # Каждая из них уже ломалась в бою: маска телефона искажала ввод, а
      # проверка «одним куском» этого не ловила — тесты моделируют
      # посимвольный ввод через собственный вывод функции.
      - name: Unit-тесты
        run: npm test

      # ── 4. JDK 17 (нужен gradle Android plugin) ─────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 5. gradle cache ─────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 6. Расшифровываем keystore из Secrets ───────────────────────────────
      # RELEASE_KEYSTORE_BASE64 — base64 файла keystore (получен через
      #   `base64 -w0 taxi-sphere-driver.keystore` на dev-машине).
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret не задан. Настройте secrets в Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/taxi-sphere-driver.keystore
          ls -la keystore/taxi-sphere-driver.keystore

      # ── 7. keystore.properties из Secrets ───────────────────────────────────
      - name: Write keystore.properties
        env:
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # rootProject.projectDir = $repo/android/, поэтому путь идёт от android/
          # вверх на 1 уровень → в корень репо → в keystore/. На CI (Linux) вложенности
          # meta-папок нет, ../../ увёл бы в /home/runner/work/{repo}/, где keystore нет.
          cat > keystore.properties <<EOF
          TAXI_SPHERE_UPLOAD_STORE_FILE=../keystore/taxi-sphere-driver.keystore
          TAXI_SPHERE_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          TAXI_SPHERE_UPLOAD_STORE_PASSWORD=${KEY_PASSWORD}
          TAXI_SPHERE_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      # ── 8. Prebuild — плагин применит signing config в android/app/build.gradle ──
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      # ── 9. Собираем APK ─────────────────────────────────────────────────────
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          # Nothing special; ubuntu-latest = ASCII path, всё работает штатно.
          NODE_ENV: production

      - name: Verify APK exists
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK не создан: $APK" >&2
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "size=$SIZE"     >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "✅ APK ready · $((SIZE / 1024 / 1024)) МБ · sha256=$SHA256"
        id: apk

      # ── 10. GitHub Release + APK как asset ──────────────────────────────────
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: ${{ steps.parse.outputs.tag }}
          prerelease: ${{ steps.parse.outputs.channel == 'beta' }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk

      # ── 11. Публикацию водителям делает АДМИНКА, а не сборка ────────────────
      # До v1.99.61 здесь стоял шаг, который регистрировал APK в админке и
      # сразу отдавал его водителям, а канал брался из формата тега. Отсюда
      # две беды: повысить бету до обычной версии можно было только
      # пересборкой с новым тегом, и решение «кому это уйдёт» принимало имя
      # тега, а не человек. Вдобавок шаг был помечен continue-on-error, и его
      # отказ (403/401) оставался незамеченным — сборка зелёная, а водители
      # обновления не видят.
      #
      # Теперь админка сама читает GitHub Releases этого репозитория
      # (Приложение водителя → Релизы → «Собранные версии») и публикует
      # выбранную сборку в выбранный канал нажатием. Секреты ADMIN_API_URL и
      # ADMIN_API_TOKEN здесь больше не нужны.

      - name: Summary
        run: |
          {
            echo "## 📦 Релиз ${{ steps.parse.outputs.tag }}"
            echo ""
            echo "| Поле | Значение |"
            echo "|---|---|"
            echo "| Версия | ${{ steps.parse.outputs.version }} |"
            echo "| Канал (подсказка из тега) | ${{ steps.parse.outputs.channel }} |"
            echo "| Размер | $((${{ steps.apk.outputs.size }} / 1024 / 1024)) МБ |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| APK | [download](https://github.com/${{ github.repository }}/releases/download/${{ steps.parse.outputs.tag }}/app-release.apk) |"
            echo ""
            echo "Водителям сборка пока НЕ отдана. Опубликуйте её в нужный канал:"
            echo "админка → Приложение водителя → Релизы → «Собранные версии»."
          } >> "$GITHUB_STEP_SUMMARY"
